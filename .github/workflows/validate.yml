name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv && .venv/bin/pip install websocket-client==1.8.0 'cryptography>=42'
      - run: pnpm typecheck
      - run: .venv/bin/python -m unittest discover -s bridge/tests
      - run: pnpm test
      - run: pnpm build
