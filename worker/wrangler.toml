name = "forge-relay"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Created by: npx wrangler d1 create forge
# Paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "forge"
database_id = "acb32476-a83b-4af9-b0a8-9c24d035b660"

[[durable_objects.bindings]]
name = "DEVICE"
class_name = "DeviceRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceRelay"]

[vars]
# Comma-separated browser origins allowed to call this Worker directly.
# The Vercel app normally proxies through /api/relay, so this is a fallback.
ALLOWED_ORIGINS = "https://zero-labs-nine.vercel.app"
APP_URL = "https://zero-labs-nine.vercel.app"
